# Build APK debug otomatis tiap push ke main (atau manual via Run workflow).
# APK bisa diunduh di halaman Actions > artifact "app-debug".
# PENTING: set repository variable API_BASE_URL di
# GitHub > Settings > Secrets and variables > Actions > Variables,
# contoh: http://103.94.238.252:3001  (tanpa garis miring di akhir)
name: Build APK

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK (pakai bawaan runner + install platform 36)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - run: npm ci

      - name: Isi alamat server API + sync Capacitor
        run: |
          URL="${{ vars.API_BASE_URL }}"
          if [ -n "$URL" ]; then
            printf 'window.API_BASE_URL = "%s";\n' "$URL" > public/app-config.js
            echo "API_BASE_URL=$URL"
          else
            echo "Variable API_BASE_URL kosong, APK memakai alamat relatif (hanya untuk tes)."
          fi
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
